name: Pipeline de Treinamento de ML

on:
  push:
    branches:
      - main
    paths:
      - 'Aula7/src/models/**'
      - 'Aula3/pyproject.toml'
      - 'Aula3/poetry.lock'
      - '.github/workflows/ml-pipeline.yaml'


env:
  PYTHON_VERSION: '3.10'

jobs:
  preparando_dados:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout repository
          uses: actions/checkout@v4 #basicamente um git clone para o github
        
        - name: Install Poetry
          run: pip install poetry
        
        - name: Install Python Version ${{ env.PYTHON_VERSION }}
          uses: actions/setup-python@v6
          with:
            python-version: ${{ env.PYTHON_VERSION }}
            cache: 'poetry'
            cache-dependency-path: Aula3/poetry.lock

        - name: Install dependencies - Poetry
          run: poetry install
          working-directory: ./Aula3

        - name: Run data preparation script (ETL)
          run: poetry run python preparar_dados.py
          working-directory: ./Aula3

        - name: Salvar dataset preparado como artefato
          uses: actions/upload-artifact@v6
          with:
            name: dataset-processado
            path: Aula3/dataset_processado.csv
  
  treinamento:
    needs: preparando_dados # faz com que o job de treinamento só seja executado após a conclusão do job de preparação de dados
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 #basicamente um git clone para o github
      
      - name: Download do Artefato do dataset processado
        uses: actions/download-artifact@v6
        with:
          name: dataset-processado

      - name: Verificar download artifact
        run: |
          echo "Content of the downloaded artifact:"
          ls -la
          echo "Content of the dataset_processado.csv:"
          cat dataset_processado.csv

      - name: Install Python Version ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Executar treinamento de teste
        run: python Aula7/src/models/teste.py dataset_processado.csv
