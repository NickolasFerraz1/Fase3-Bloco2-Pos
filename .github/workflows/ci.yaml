# Workflow 
name: CI - MLOps

# Conditions 
on:
    pull_request:
        branches:
            - main

# Variables
env: 
    PYTHON_VERSION: '3.10'
# Jobs
jobs:
    validacao_ambiente: 
        runs-on: ubuntu-latest
        steps:
          - name: Checkout repository
            uses: actions/checkout@v4 #basicamente um git clone para o github
          
          - name: Install Poetry
            run: pip install poetry

          - name: Install Python
            uses: actions/setup-python@v6
            with:
              python-version: ${{ env.PYTHON_VERSION }}
              cache: 'poetry'
          
          - name: Run script validation
            run: python Aula1/validate_env.py

          - name: Install nbstripout
            run: pip install nbstripout

          - name: Analyze Jupyter Notebooks
            run: |
                nbstripout --verify Aula2/explorer.ipynb || {
                echo "::error file=Aula2/explorer.ipynb::Notebook contém células com output. Remova antes de commitar."
                exit 1
                }

          - name: Instalar Ruff (Linter)
            run: pip install ruff 

          - name: Run Linter
            run: ruff check .
            
          - name: Install dependencies - Poetry
            run: poetry install
            working-directory: ./Aula2
