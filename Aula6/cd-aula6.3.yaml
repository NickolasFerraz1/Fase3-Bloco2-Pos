name: CD - Build and Push Docker Image!
on:
  push:
    branches:
      - main

env:
    REGISTRY: ghcr.io #Github Container Registry
    IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Definir nome da imagem em minúsculas
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: Aula5/
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
  deploy-production:
    needs: build-and-push
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://nickolas.com.br
    
    env:
        API_ENV: "production"
        LOG_LEVEL: "WARNING"
        MODEL_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
    
      - name: Atualizar imagem do deployment
        run: |
          # GHCR exige o nome da imagem em minúsculas (mesmo tratamento do job anterior)
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${{ github.sha }}"
          sed -i "s|image: nginx:latest|image: ${IMAGE}|g" Aula6/k8s/deployment.yaml
          sed -i "s|\${API_ENV}|${API_ENV}|g" Aula6/k8s/deployment.yaml
          sed -i "s|\${LOG_LEVEL}|${LOG_LEVEL}|g" Aula6/k8s/deployment.yaml
    
      - name: Deploy - Produção
        run: |
          echo "O arquivo YAML mutado que será enviado para nuvem"
          cat Aula6/k8s/deployment.yaml
          echo "Deploy Executado"