apiVersion: apps/v1
kind: Deployment
metadata:
  name: anti-fraud-api
  namespace: aula6
spec:
  replicas: 2
  selector:
    matchLabels:
      app: anti-fraud-api
  template:
    metadata:
      labels:
        app: anti-fraud-api
    spec:
      containers:
        - name: anti-fraud-api
          image: nginx:latest
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          ports:
            - containerPort: 8080
          env:
            - name: API_ENV
              value: ${API_ENV}
            - name: LOG_LEVEL
              value: ${LOG_LEVEL}